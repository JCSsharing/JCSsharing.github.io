<html lang="de">
<head>
<meta charset="utf-8">

<title>Blue Age Club Bauplan</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:linear-gradient(135deg,#0B2530 0%,#16404A 100%);color:#E8F4F6;display:grid;place-items:center;padding:24px}
.box{width:100%;max-width:380px}
.wm{font-size:15px;font-weight:500;letter-spacing:.16em;text-transform:uppercase;margin:0 0 36px}
h1{font-size:30px;font-weight:300;letter-spacing:-.02em;margin:0 0 6px}
p.sub{margin:0 0 28px;color:#A9C7CE;font-size:14px;line-height:1.5}
label{display:block;font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:#A9C7CE;margin:0 0 6px}
input{width:100%;font:inherit;font-size:16px;padding:12px 14px;border-radius:10px;border:1px solid rgba(232,244,246,.25);background:rgba(255,255,255,.06);color:#fff;margin:0 0 18px}
input:focus{outline:2px solid #7FD1DE;outline-offset:1px;border-color:transparent}
button{width:100%;font:inherit;font-size:15px;font-weight:600;padding:13px;border:0;border-radius:10px;background:#E8F4F6;color:#0B2530;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
.err{min-height:22px;margin:14px 0 0;color:#FFB4AB;font-size:14px}
.note{margin:28px 0 0;font-size:12px;color:#7FA3AB;line-height:1.5}
</style>
</head>
<body>
<main class="box">
  <p class="wm">Blue Age Club</p>
  <h1>Bauplan</h1>
  <p class="sub">Strategietag mit Prof. Dr. Thomas Kälicke. Bitte melde dich an.</p>
  <form id="f" autocomplete="on">
    <label for="u">Benutzername</label>
    <input id="u" name="username" autocomplete="username" required>
    <label for="p">Passwort</label>
    <input id="p" name="password" type="password" autocomplete="current-password" required>
    <button id="b" type="submit">Anmelden</button>
    <p class="err" id="e" role="alert" aria-live="assertive"></p>
  </form>
  <p class="note">Nur für Thomas, Jens und Daniel.</p>
</main>

const ub=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const ss={get(k){try{return sessionStorage.getItem(k)}catch(e){return null}},set(k,v){try{sessionStorage.setItem(k,v)}catch(e){}}};
async function unlock(pw){
  const km=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
  const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:ub(D.s),iterations:D.i,hash:"SHA-256"},km,{name:"AES-GCM",length:256},false,["decrypt"]);
  const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:ub(D.v)},key,ub(D.c));
  return new TextDecoder().decode(pt);
}
function show(html){ document.open(); document.write(html); document.close(); }
const f=document.getElementById("f"), e=document.getElementById("e"), b=document.getElementById("b");
f.addEventListener("submit",async ev=>{
  ev.preventDefault(); e.textContent="";
  const u=document.getElementById("u").value.trim().toLowerCase(), pw=document.getElementById("p").value.trim().toUpperCase();
  if(!D.u.includes(u)){ e.textContent="Benutzername oder Passwort stimmt nicht."; return; }
  b.disabled=true; b.textContent="Wird geöffnet …";
  try{ const html=await unlock(pw); ss.set("bac.bauplan.k",pw); ss.set("bac.bauplan.u",u); show(html); }
  catch(x){ b.disabled=false; b.textContent="Anmelden"; e.textContent="Benutzername oder Passwort stimmt nicht."; document.getElementById("p").select(); }
});
(async()=>{ const k=ss.get("bac.bauplan.k"); if(k){ try{ show(await unlock(k)); return; }catch(x){} } document.getElementById("u").focus(); })();
})();
</script>
